name: connecthub
description: "ConnectHub - A modern social media app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.7

  # State Management
  flutter_bloc: ^9.1.1

  # Networking
  dio: ^5.8.0+1
  http: ^1.4.0

  # Image
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
